:root{--bg:#fff;--card:#f2f4f8;--ink:#14151a;--mut:#7a8090;--pri:#2f6bff;--top:#6366f1;--line:#e3e6ee;color-scheme:light dark}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1d2030;--ink:#f2f3f7;--mut:#98a0b3;--line:#2b2f45}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1d2030;--ink:#f2f3f7;--mut:#98a0b3;--line:#2b2f45}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Rubik,"Trebuchet MS",system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#top{background:var(--top);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between}
#m{flex:1;overflow-y:auto;padding:14px 16px 20px}
#nav{display:flex;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#nav button{flex:1;font-size:22px;background:none;border:0;padding:8px;border-radius:14px;cursor:pointer;opacity:.55}
#nav button.on{background:var(--card);opacity:1}
h2{margin:0;font-size:22px}h3{font-size:12px;letter-spacing:.1em;color:var(--mut);margin:18px 0 8px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.back,.sm{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
.sm{background:var(--pri);color:#fff;border:0;padding:6px 12px;font-size:13px}
.sm.red{background:#e5484d}
.big{width:100%;font:inherit;font-weight:700;font-size:18px;border:0;border-radius:18px;padding:16px;background:var(--pri);color:#fff;cursor:pointer;margin:12px 0}
.big:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cs{border:3px solid var(--ink);border-radius:24px;padding:14px 8px;text-align:center;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.cs .ic{font-size:56px;display:block;margin-bottom:6px}
.cs.lock{opacity:.45;border-color:var(--mut);cursor:default}
.tag{display:inline-block;background:var(--card);border-radius:99px;padding:4px 12px;font-size:14px;margin-top:6px}
.tag.free{background:#d9f5e3;color:#16803c}
.ph{border:3px solid #111;border-radius:14px;position:relative;flex:none;color:rgba(0,0,0,.65)}
.ph i{position:absolute;top:8%;left:14%;width:24%;aspect-ratio:1;border-radius:50%;background:#111}
.ph i+i{top:8%;left:14%;transform:translateY(130%)}
.ph small{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:14px;text-align:center;position:relative}
.card .nm{font-weight:600;margin-top:8px;font-size:15px}
.card .pr{font-weight:700;font-size:20px;margin-top:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.row .nf{flex:1}.row b{display:block}.row span{font-size:14px;font-weight:600}
.pct{font-weight:700;font-size:20px}
.rl{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:24px;background:var(--bg);height:200px}
.tr{display:flex;width:max-content;padding:14px 0 0}
.ri{width:120px;flex:none;text-align:center;font-size:13px;font-weight:600;padding:0 4px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border-bottom:5px solid}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--pri);z-index:2}
.rb{background:var(--card);border-radius:18px;padding:14px;margin-top:6px;display:flex;align-items:center;gap:12px;justify-content:space-between}
input.q{width:100%;font:inherit;padding:13px 16px;border:0;border-radius:16px;background:var(--card);color:var(--ink);margin-bottom:12px}
.slots{display:flex;align-items:center;gap:10px}
.slot{flex:1;height:150px;border:2px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mut);padding:8px;gap:6px}
.wh{width:220px;height:220px;border-radius:50%;margin:18px auto 6px;position:relative}
.wh .in{position:absolute;inset:22px;border-radius:50%;background:var(--bg)}
.nd{position:absolute;inset:0}
.nd:before{content:'';position:absolute;left:50%;top:4px;width:14px;height:48%;margin-left:-7px;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.hs .card{min-width:110px;padding:10px;cursor:pointer}
.hs .card.sel{outline:3px solid var(--pri)}
.prof{background:linear-gradient(135deg,#2f6bff,#5b7fe8);color:#fff;border-radius:28px;padding:22px;font-size:24px;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:8px 4px;color:var(--mut)}.kv b{color:var(--ink)}
.st{background:var(--card);border-radius:24px;padding:18px;margin:12px 0}
.st div{display:flex;justify-content:space-between;font-weight:600;padding:6px 0}
#toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
.empty{color:var(--mut);padding:18px 4px}
.phs{filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));flex:none;display:block}
.cs{background:linear-gradient(160deg,var(--card),var(--bg));box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.cs:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cs.lock{box-shadow:none}
.mk{width:4px;margin-left:-2px;box-shadow:0 0 12px var(--pri)}
.mk:before,.mk:after{content:'';position:absolute;left:50%;width:26px;height:24px;margin-left:-13px;background:var(--ink)}
.mk:before{top:-2px;clip-path:polygon(0 0,100% 0,50% 100%)}
.mk:after{bottom:-2px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.big{background:linear-gradient(180deg,color-mix(in srgb,var(--pri),#fff 22%),var(--pri));box-shadow:0 5px 0 color-mix(in srgb,var(--pri),#000 40%)}
.big:active{box-shadow:0 2px 0 color-mix(in srgb,var(--pri),#000 40%)}
.ca{display:block;margin:0 auto 6px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:flt 3.5s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-5px)}}
.rb .nf{flex:1}.rb .phs{animation:flt 3s ease-in-out infinite}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block}
.tb{width:190px;height:190px;margin:14px auto 10px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pri),#fff 45%),var(--pri) 55%,color-mix(in srgb,var(--pri),#000 45%));box-shadow:0 10px 0 color-mix(in srgb,var(--pri),#000 45%),0 22px 40px rgba(0,0,0,.35);cursor:pointer;user-select:none;touch-action:manipulation}
.tb:active{transform:translateY(8px);box-shadow:0 2px 0 color-mix(in srgb,var(--pri),#000 45%)}
.tb svg{pointer-events:none}
.fl{position:fixed;z-index:9;pointer-events:none;font-weight:800;color:#ffd84a;text-shadow:0 2px 0 #000b;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
.fl.cr{color:#ff5a5f;font-size:24px}
*{-webkit-tap-highlight-color:transparent}
#bg:after{content:'';position:absolute;inset:0;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:34px 34px;opacity:.07;animation:gm 40s linear infinite}
@keyframes gm{to{background-position:340px 340px}}
.row,.st,.rb,.dly{background:color-mix(in srgb,var(--card) 62%,transparent);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}
#nav{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10px;font-weight:600;color:var(--ink);padding:7px 2px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 16%,transparent)}
#top{align-items:center;gap:10px}
.ttl{flex:1;text-align:center}
.lvl{position:relative;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:13px;overflow:hidden}
.lvl i{position:absolute;left:0;bottom:0;height:3px;background:#ffd84a}
.lvl b{position:relative}
.bal{display:flex;gap:6px;align-items:center}
.dly{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:20px;padding:12px 16px;margin-bottom:14px}
.dly span{font-size:13px;opacity:.8}
.sm:disabled{opacity:.4}
.multi{display:flex;gap:10px}.multi .back{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:transparent}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.dbox{background:var(--bg);color:var(--ink);border-radius:22px;padding:20px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dbox p{margin:0 0 12px;font-weight:600}
.dbox input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.dbt{display:flex;gap:10px;justify-content:flex-end}
.rl:before,.rl:after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:1;pointer-events:none}
.rl:before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rl:after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.wh{width:260px;height:260px}
.wh:before{content:'';position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--bg) 85%,transparent),transparent 72%)}
.ws{position:absolute;inset:0;width:100%;height:100%;color:var(--ink)}
.nd:before{display:none}
.nd svg{width:100%;height:100%;filter:drop-shadow(0 0 7px rgba(255,255,255,.55)) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.wc{position:absolute;left:0;right:0;top:63%;text-align:center;font-size:24px;font-weight:800}
.tb:before{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--pri);opacity:.5;animation:pr 2s ease-out infinite}
@keyframes pr{to{transform:scale(1.25);opacity:0}}
.tb.hit svg{animation:pop .15s}
@keyframes pop{50%{transform:scale(.86) rotate(-5deg)}}
@keyframes up{to{transform:translate(-50%,-150px);opacity:0}}
.rl{background:repeating-linear-gradient(90deg,var(--card) 0 120px,var(--bg) 120px 240px)}
.card{box-shadow:0 2px 0 var(--line)}
.card .phs{margin:0 auto}
:root{--b1:#e8ecff;--b2:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#1a1d3d;--b2:#0e0f16}}
:root[data-theme="dark"]{--b1:#1a1d3d;--b2:#0e0f16}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2))}
#bg b{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 20s ease-in-out infinite alternate}
#bg b:nth-child(1){background:#6366f1;left:-20vmax;top:-20vmax}
#bg b:nth-child(2){background:#2f6bff;right:-25vmax;bottom:-10vmax;animation-duration:26s;animation-delay:-8s}
#bg b:nth-child(3){background:#c77dff;left:20vmax;top:40vh;width:45vmax;height:45vmax;opacity:.3;animation-duration:32s;animation-delay:-14s}
#bg u{position:absolute;bottom:-90px;width:34px;height:60px;border:3px solid currentColor;border-radius:9px;opacity:.12;animation:rise linear infinite}
@keyframes fl{to{transform:translate(18vmax,12vmax) scale(1.2)}}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}
body.noanim #bg b,body.noanim #bg u{animation:none}
@media (prefers-reduced-motion:reduce){#bg b,#bg u{animation:none}}
#app{z-index:1}
#top{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.big{background:linear-gradient(180deg,#4a82ff,#2457e6);box-shadow:0 5px 0 #1a3fa8}

.r2{box-shadow:0 0 0 2px #8b4fd855,0 0 14px #8b4fd844}
.r3{box-shadow:0 0 0 2px #c99a0077,0 0 20px #c99a0066;overflow:hidden}
.r3::after{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.38) 50%,transparent 60%);background-size:250% 100%;animation:sh 3s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-100% 0}}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pri)}.sw.on:after{left:23px}
.prof{display:flex;justify-content:space-between;align-items:center}
.gear{font-size:22px;background:rgba(255,255,255,.22);border:0;border-radius:50%;width:46px;height:46px;cursor:pointer}

@keyframes cf{0%{transform:translate(0,0)}40%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(calc(var(--dx)*1.3),380px) rotate(720deg);opacity:0}}
